name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版工具链 (x64 与 x86)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: 自动化全链路测试 (x64)
        run: cargo test --release --verbose

      - name: 极限优化编译 (x64)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: 极限优化编译 (x86)
        run: cargo build --release --target i686-pc-windows-msvc

      - name: 安装 Inno Setup 打包引擎
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # 双重保障：复制简体中文语言包至 Inno Setup 系统语言目录
          New-Item -ItemType Directory -Force -Path "C:\Program Files (x86)\Inno Setup 6\Languages" | Out-Null
          Copy-Item "installer/ChineseSimplified.isl" -Destination "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -Force

      - name: 构建一键 Windows 安装包 (x64 Setup.exe)
        run: iscc installer/NetTrigger.iss

      - name: 整理发布产物与生成校验和
        id: package
        shell: pwsh
        run: |
          # 1. 获取版本号（优先从 git tag 获取，例如 v1.1.0；若 dispatch 则从 Cargo.toml 取）
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v")) {
            $version = "v" + ((Get-Content Cargo.toml | Select-String 'version = "([^"]+)"').Matches.Groups[1].Value)
          }
          
          # 2. 确保产物目录
          $distDir = "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          # 3. 复制 x64 产物并打包
          $x64Exe = "NetTrigger-${version}-windows-x64.exe"
          $x64Zip = "NetTrigger-${version}-windows-x64-portable.zip"
          Copy-Item "target/x86_64-pc-windows-msvc/release/NetTrigger.exe" -Destination $x64Exe
          Copy-Item "target/x86_64-pc-windows-msvc/release/NetTrigger.exe" -Destination "NetTrigger.exe"
          
          $x64TempDir = "temp_x64"
          New-Item -ItemType Directory -Force -Path $x64TempDir | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/NetTrigger.exe" -Destination "$x64TempDir/NetTrigger.exe"
          Copy-Item "config.example.toml" -Destination "$x64TempDir/config.example.toml"
          Copy-Item "README.md" -Destination "$x64TempDir/README.md"
          Compress-Archive -Path "$x64TempDir/*" -DestinationPath $x64Zip -Force
          Copy-Item $x64Zip -Destination "NetTrigger-windows-x64-portable.zip"
          
          # 4. 复制 x86 (32位) 产物并打包
          $x86Exe = "NetTrigger-${version}-windows-x86.exe"
          $x86Zip = "NetTrigger-${version}-windows-x86-portable.zip"
          Copy-Item "target/i686-pc-windows-msvc/release/NetTrigger.exe" -Destination $x86Exe
          
          $x86TempDir = "temp_x86"
          New-Item -ItemType Directory -Force -Path $x86TempDir | Out-Null
          Copy-Item "target/i686-pc-windows-msvc/release/NetTrigger.exe" -Destination "$x86TempDir/NetTrigger.exe"
          Copy-Item "config.example.toml" -Destination "$x86TempDir/config.example.toml"
          Copy-Item "README.md" -Destination "$x86TempDir/README.md"
          Compress-Archive -Path "$x86TempDir/*" -DestinationPath $x86Zip -Force
          
          # 5. 获取安装包文件名 (x64)
          $setupExeItem = Get-ChildItem -Path $distDir -Filter "*Setup.exe" | Select-Object -First 1
          if ($setupExeItem) {
            $setupExe = $setupExeItem.Name
            Copy-Item "$distDir/$setupExe" -Destination "$distDir/NetTrigger-Setup.exe" -Force
          }
          
          # 6. 生成所有产物的 SHA256 校验和
          $x64ExeHash = (Get-FileHash $x64Exe -Algorithm SHA256).Hash
          $x64ZipHash = (Get-FileHash $x64Zip -Algorithm SHA256).Hash
          $x86ExeHash = (Get-FileHash $x86Exe -Algorithm SHA256).Hash
          $x86ZipHash = (Get-FileHash $x86Zip -Algorithm SHA256).Hash
          
          $checksumContent = @"
$x64ExeHash  $x64Exe
$x64ZipHash  $x64Zip
$x86ExeHash  $x86Exe
$x86ZipHash  $x86Zip
"@
          if ($setupExeItem) {
            $setupHash = (Get-FileHash "$distDir/$setupExe" -Algorithm SHA256).Hash
            $checksumContent += "`n$setupHash  $setupExe"
          }
          Set-Content -Path "checksums.txt" -Value $checksumContent
          
          Write-Host "打包成功:"
          if ($setupExeItem) { Write-Host "$setupExe SHA256: $setupHash" }
          Write-Host "$x64Exe SHA256: $x64ExeHash"
          Write-Host "$x64Zip SHA256: $x64ZipHash"
          Write-Host "$x86Exe SHA256: $x86ExeHash"
          Write-Host "$x86Zip SHA256: $x86ZipHash"

      - name: 创建 GitHub Release 并上传附件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "NetTrigger ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*Setup.exe
            NetTrigger-v*-windows-x64.exe
            NetTrigger-v*-windows-x64-portable.zip
            NetTrigger-v*-windows-x86.exe
            NetTrigger-v*-windows-x86-portable.zip
            NetTrigger.exe
            NetTrigger-windows-x64-portable.zip
            checksums.txt
