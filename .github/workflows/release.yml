name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 自动化全链路测试
        run: cargo test --release --verbose

      - name: 极限优化编译 (LTO & Strip)
        run: cargo build --release

      - name: 安装 Inno Setup 打包引擎
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # 双重保障：复制简体中文语言包至 Inno Setup 系统语言目录
          New-Item -ItemType Directory -Force -Path "C:\Program Files (x86)\Inno Setup 6\Languages" | Out-Null
          Copy-Item "installer/ChineseSimplified.isl" -Destination "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -Force

      - name: 构建一键 Windows 安装包 (Setup.exe)
        run: iscc installer/NetTrigger.iss

      - name: 整理发布产物与生成校验和
        id: package
        shell: pwsh
        run: |
          # 1. 获取版本号（优先从 git tag 获取，例如 v1.1.0；若 dispatch 则从 Cargo.toml 取）
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v")) {
            $version = "v" + ((Get-Content Cargo.toml | Select-String 'version = "([^"]+)"').Matches.Groups[1].Value)
          }
          
          # 2. 确保产物目录
          $distDir = "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          # 3. 复制核心可执行程序与配置模板
          Copy-Item "target/release/NetTrigger.exe" -Destination "$distDir/NetTrigger.exe"
          Copy-Item "config.example.toml" -Destination "$distDir/config.example.toml"
          Copy-Item "README.md" -Destination "$distDir/README.md"
          
          # 4. 压缩为便携 Zip 压缩包（命名带版本号）
          $zipName = "NetTrigger-${version}-windows-x64-portable.zip"
          Compress-Archive -Path "$distDir/NetTrigger.exe", "$distDir/config.example.toml", "$distDir/README.md" -DestinationPath $zipName -Force
          
          # 5. 单独的绿色单文件可执行程序重命名为带版本号的独立产物
          $standaloneExe = "NetTrigger-${version}-windows-x64.exe"
          Copy-Item "target/release/NetTrigger.exe" -Destination $standaloneExe
          
          # 6. 获取安装包文件名
          $setupExe = (Get-ChildItem -Path $distDir -Filter "*Setup.exe" | Select-Object -First 1).Name
          
          # 7. 生成所有产物的 SHA256 校验和
          $setupHash = (Get-FileHash "$distDir/$setupExe" -Algorithm SHA256).Hash
          $exeHash = (Get-FileHash $standaloneExe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          
          $checksumContent = @"
          $setupHash  $setupExe
          $exeHash  $standaloneExe
          $zipHash  $zipName
          "@
          Set-Content -Path "checksums.txt" -Value $checksumContent
          
          Write-Host "打包成功:"
          Write-Host "$setupExe SHA256: $setupHash"
          Write-Host "$standaloneExe SHA256: $exeHash"
          Write-Host "$zipName SHA256: $zipHash"

      - name: 创建 GitHub Release 并上传附件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "NetTrigger ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*Setup.exe
            NetTrigger-v*-windows-x64.exe
            NetTrigger-v*-windows-x64-portable.zip
            checksums.txt
