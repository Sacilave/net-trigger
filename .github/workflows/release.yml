name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 自动化全链路测试
        run: cargo test --release --verbose

      - name: 极限优化编译 (LTO & Strip)
        run: cargo build --release

      - name: 安装 Inno Setup 打包引擎
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 构建一键 Windows 安装包 (Setup.exe)
        run: iscc installer/NetTrigger.iss

      - name: 整理发布产物与生成校验和
        id: package
        shell: pwsh
        run: |
          # 1. 确保产物目录
          $distDir = "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          # 2. 复制核心可执行程序与配置模板
          Copy-Item "target/release/NetTrigger.exe" -Destination "$distDir/NetTrigger.exe"
          Copy-Item "config.example.toml" -Destination "$distDir/config.example.toml"
          Copy-Item "README.md" -Destination "$distDir/README.md"
          
          # 3. 压缩为便携 Zip 压缩包（仅含绿色便携文件）
          $zipName = "NetTrigger-windows-x64-portable.zip"
          Compress-Archive -Path "$distDir/NetTrigger.exe", "$distDir/config.example.toml", "$distDir/README.md" -DestinationPath $zipName -Force
          
          # 4. 生成所有产物的 SHA256 校验和
          $setupHash = (Get-FileHash "$distDir/NetTrigger-Setup.exe" -Algorithm SHA256).Hash
          $exeHash = (Get-FileHash "$distDir/NetTrigger.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          
          $checksumContent = @"
          $setupHash  NetTrigger-Setup.exe
          $exeHash  NetTrigger.exe
          $zipHash  $zipName
          "@
          Set-Content -Path "checksums.txt" -Value $checksumContent
          
          Write-Host "打包成功:"
          Write-Host "NetTrigger-Setup.exe SHA256: $setupHash"
          Write-Host "NetTrigger.exe SHA256: $exeHash"
          Write-Host "$zipName SHA256: $zipHash"

      - name: 创建 GitHub Release 并上传附件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "NetTrigger ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/NetTrigger-Setup.exe
            target/release/NetTrigger.exe
            NetTrigger-windows-x64-portable.zip
            checksums.txt
