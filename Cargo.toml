[package]
name = "nettrigger"
version = "1.2.2"
edition = "2021"
authors = ["Sacilave <sacilave@gmail.com>"]
repository = "https://github.com/Sacilave/net-trigger"
description = "原生极轻量、事件驱动（0延迟）的 Windows 网络状态感知与 Captive Portal 认证守护引擎"
license = "CC-BY-NC-4.0"

[[bin]]
name = "NetTrigger"
path = "src/main.rs"

[dependencies]
# 极轻量同步 HTTP 客户端 (无 async 运行时巨大常驻内存开销)
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# 配置解析与序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Windows 原生轻量托盘支持
tray-icon = "0.19"

# 极简高精度数学运算 (用于锐捷 SAM+ RSA 密码加密，0 外部重依赖)
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }

# Windows 原生 API 绑定 (细粒度按需引入)
[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"     # 针对二进制体积进行极致优化
lto = true          # 启用全局链接时优化
codegen-units = 1   # 最大化内联与剪裁
panic = "abort"     # 禁用栈展开以精简体积
strip = true        # 剥离所有调试符号
